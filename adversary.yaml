name: adversary
version: 0.0.2
description: Reviews TypeScript adversaries for SDK usage, rule design, finding quality, tests, packaging, and publish readiness.

triggers:
  manual: true
  files_changed:
    - "adversary.yaml"
    - "package.json"
    - "tsconfig.json"
    - "src/**/*.ts"
    - "test/**"
    - "tests/**"
    - ".adversaryignore"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write: []
  network: false
  environment:
    allow: []

findings:
  format: adversary.review.v1
